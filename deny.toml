# cargo-deny configuration for Vult
# See: https://embarkstudios.github.io/cargo-deny/

# Note: This configuration requires cargo-deny to be installed:
#   cargo install cargo-deny
# Run with:
#   cargo deny check

[graph]
# Target platforms to check
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
# The database to use for checking advisories
db-path = "~/.cargo/advisory-db"
# Warn about yanked crates
yanked = "warn"
# Ignore specific advisories that don't affect us
ignore = [
    # RSA Marvin attack - only affects MySQL connections (we only use SQLite)
    "RUSTSEC-2023-0071",
    # GTK3 unmaintained warnings - unavoidable Tauri dependencies on Linux
    # These are maintained by Tauri team and safe for our GUI use case
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0429", # glib unsound Iterator impl (Tauri dependency)
    # Unmaintained crates from Tauri dependencies
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2025-0057", # fxhash
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]

[licenses]
# Allow these licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",        # Boost Software License (used by clipboard-win)
    "Unicode-3.0",    # Unicode License v3 (used by icu_* crates from Tauri)
    "CDLA-Permissive-2.0",  # Community Data License (used by webpki-roots from SQLx)
]
# Confidence threshold for license detection
confidence-threshold = 0.8
# Crates to allow with any license (escape hatch)
# exceptions = []

[bans]
# Lint level for multiple versions of same crate
multiple-versions = "warn"
# Lint level for build scripts
wildcards = "allow"
# Highlight the specific crates that depend on banned crates
highlight = "all"
# Deny specific crates entirely
deny = [
    # Crate name patterns to deny, e.g.:
    # { name = "unsafe-crate" }
]
# Allow specific crates (escape hatch for multiple-versions, etc.)
# skip = []
# Skip checking tree for specific crates
# skip-tree = []

[sources]
# Lint level for crates not from an allowed source
unknown-registry = "deny"
unknown-git = "warn"
# Allowed git sources
# allow-git = []
# Allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Organization-specific overrides (uncomment if needed)
# [sources.allow-org]
# github = ["my-org"]
